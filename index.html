<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permanecer - Temporizador</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #ffdee9, #b5fffc, #fbc2eb, #a6c1ee);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.6);
            padding: 2rem;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 350px;
        }

        h2 { font-weight: 300; color: #555; margin-top: 0; }

        /* Contenedor de las ruedas */
        .picker-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 180px; /* Un poco más alto para ver mejor */
            margin: 20px 0;
            position: relative;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
        }

        .picker-column {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .picker-column::-webkit-scrollbar { display: none; }

        .picker-item {
            height: 60px; /* Altura fija para el cálculo */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #444;
            scroll-snap-align: center;
        }

        /* Líneas de selección central */
        .selection-overlay {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            height: 60px;
            border-top: 2px solid rgba(0,0,0,0.1);
            border-bottom: 2px solid rgba(0,0,0,0.1);
            pointer-events: none;
            background: rgba(255, 255, 255, 0.3);
        }

        #display {
            font-size: 4rem;
            font-weight: 300;
            color: #444;
            margin: 2rem 0;
            display: none;
        }

        button {
            padding: 15px 40px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            background-color: #555;
            color: white;
            letter-spacing: 2px;
            cursor: pointer;
            width: 100%;
        }

        .unit-label {
            font-size: 0.7rem;
            color: #999;
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
        }

        .col-wrapper { position: relative; flex: 1; height: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Permanecer</h2>
        
        <div id="display">00:00:00</div>

        <div id="picker" class="picker-container">
            <div class="selection-overlay"></div>
            
            <div class="col-wrapper">
                <div class="picker-column" id="col-h"></div>
                <div class="unit-label">horas</div>
            </div>
            <div class="col-wrapper">
                <div class="picker-column" id="col-m"></div>
                <div class="unit-label">min</div>
            </div>
            <div class="col-wrapper">
                <div class="picker-column" id="col-s"></div>
                <div class="unit-label">seg</div>
            </div>
        </div>

        <button id="btnAction" onclick="toggleTimer()">INICIAR</button>
    </div>

    <audio id="bowlSound" src="tibetan-bowl.mp3"></audio>

    <script>
        // Función para llenar las columnas con números
        function fillColumn(id, max) {
            const col = document.getElementById(id);
            // Espacio vacío inicial
            col.innerHTML = '<div class="picker-item"></div>';
            for (let i = 0; i <= max; i++) {
                const item = document.createElement('div');
                item.className = 'picker-item';
                item.innerText = i.toString().padStart(2, '0');
                col.appendChild(item);
            }
            // Espacio vacío final
            col.innerHTML += '<div class="picker-item"></div>';
        }

        fillColumn('col-h', 23);
        fillColumn('col-m', 59);
        fillColumn('col-s', 59);

        let interval;
        let timeLeft;
        let isRunning = false;

        function getVal(id) {
            const col = document.getElementById(id);
            // Calculamos el número basado en cuánto hemos bajado el scroll
            const index = Math.round(col.scrollTop / 60);
            return index;
        }

        function toggleTimer() {
            const btn = document.getElementById('btnAction');
            const display = document.getElementById('display');
            const picker = document.getElementById('picker');
            const sound = document.getElementById('bowlSound');

            if (!isRunning) {
                const h = getVal('col-h');
                const m = getVal('col-m');
                const s = getVal('col-s');
                timeLeft = (h * 3600) + (m * 60) + s;

                if (timeLeft <= 0) {
                    alert("Por favor, selecciona un tiempo");
                    return;
                }

                isRunning = true;
                btn.innerText = "DETENER";
                picker.style.display = "none";
                display.style.display = "block";
                updateDisplay();

                interval = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(interval);
                        sound.play();
                        resetUI();
                    }
                }, 1000);
            } else {
                clearInterval(interval);
                resetUI();
            }
        }

        function updateDisplay() {
            const h = Math.floor(timeLeft / 3600);
            const m = Math.floor((timeLeft % 3600) / 60);
            const s = timeLeft % 60;
            document.getElementById('display').innerText = 
                `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function resetUI() {
            isRunning = false;
            document.getElementById('btnAction').innerText = "INICIAR";
            document.getElementById('picker').style.display = "flex";
            document.getElementById('display').style.display = "none";
        }
    </script>
</body>
</html>
