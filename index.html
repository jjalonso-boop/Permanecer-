<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permanecer</title>
    <link rel="icon" type="image/jpeg" href="icono.jpg">
    <link rel="apple-touch-icon" href="icono.jpg">
    <style>
        body {
            margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(-45deg, #ffdee9, #b5fffc, #fbc2eb, #a6c1ee);
            background-size: 400% 400%; animation: gradient 15s ease infinite; overflow: hidden;
        }
        @keyframes gradient { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }

        .container {
            background: rgba(255, 255, 255, 0.7); padding: 2rem; border-radius: 35px;
            backdrop-filter: blur(15px); text-align: center; width: 85%; max-width: 320px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        h2 { font-weight: 300; color: #444; margin-bottom: 10px; letter-spacing: 1px; }

        .picker-container {
            display: flex; justify-content: center; height: 210px; margin: 20px 0;
            position: relative; overflow: hidden;
        }

        /* La ventana de selección central */
        .selection-box {
            position: absolute; top: 70px; height: 70px; width: 100%;
            border-top: 1px solid rgba(0,0,0,0.15); border-bottom: 1px solid rgba(0,0,0,0.15);
            pointer-events: none; background: rgba(255,255,255,0.3);
        }

        .picker-col {
            flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .picker-col::-webkit-scrollbar { display: none; }

        .item {
            height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 1.4rem; color: rgba(0,0,0,0.2); transition: all 0.2s; scroll-snap-align: center;
        }

        /* Clase para el número seleccionado */
        .item.selected {
            color: #000; font-weight: bold; font-size: 2.2rem;
        }

        .label { font-size: 0.65rem; color: #888; margin-top: 2px; font-weight: normal; }

        #display { font-size: 4rem; color: #333; display: none; margin: 50px 0; font-weight: 200; }

        button {
            width: 100%; padding: 18px; border-radius: 50px; border: none;
            background: #444; color: white; font-size: 1.1rem; letter-spacing: 2px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Permanecer</h2>
    <div id="display">00:00:00</div>

    <div id="picker" class="picker-container">
        <div class="selection-box"></div>
        <div class="picker-col" id="h"></div>
        <div class="picker-col" id="m"></div>
        <div class="picker-col" id="s"></div>
    </div>

    <button id="btn" onclick="start()">INICIAR</button>
</div>

<audio id="snd" src="tibetan-bowl.mp3"></audio>

<script>
    function fill(id, max, label) {
        const el = document.getElementById(id);
        let html = '<div class="item"></div>'; // Espacio inicial
        for(let i=0; i<=max; i++) {
            html += `<div class="item" data-val="${i}">${i.toString().padStart(2,'0')}<span class="label">${label}</span></div>`;
        }
        html += '<div class="item"></div>'; // Espacio final
        el.innerHTML = html;

        // Detectar scroll para resaltar
        el.addEventListener('scroll', () => highlight(id));
        setTimeout(() => highlight(id), 500); // Resaltar al cargar
    }

    function highlight(id) {
        const col = document.getElementById(id);
        const items = col.getElementsByClassName('item');
        const center = col.scrollTop + 105; // Centro del contenedor
        
        for (let item of items) {
            const itemCenter = item.offsetTop + 35;
            if (Math.abs(center - itemCenter) < 35) {
                item.classList.add('selected');
            } else {
                item.classList.remove('selected');
            }
        }
    }

    fill('h', 23, 'hs'); fill('m', 59, 'min'); fill('s', 59, 'seg');

    let timer;
    let secondsLeft;

    function start() {
        const btn = document.getElementById('btn');
        if (btn.innerText === "DETENER") { clearInterval(timer); resetUI(); return; }

        const h = Math.round(document.getElementById('h').scrollTop / 70);
        const m = Math.round(document.getElementById('m').scrollTop / 70);
        const s = Math.round(document.getElementById('s').scrollTop / 70);
        secondsLeft = (h * 3600) + (m * 60) + s;

        if (secondsLeft <= 0) return;

        document.getElementById('picker').style.display = 'none';
        document.getElementById('display').style.display = 'block';
        btn.innerText = "DETENER";

        timer = setInterval(() => {
            secondsLeft--;
            const hh = Math.floor(secondsLeft / 3600);
            const mm = Math.floor((secondsLeft % 3600) / 60);
            const ss = secondsLeft % 60;
            document.getElementById('display').innerText = 
                `${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;
            
            if (secondsLeft <= 0) {
                clearInterval(timer);
                document.getElementById('snd').play();
                resetUI();
            }
        }, 1000);
    }

    function resetUI() {
        document.getElementById('btn').innerText = "INICIAR";
        document.getElementById('picker').style.display = 'flex';
        document.getElementById('display').style.display = 'none';
    }
</script>
</body>
</html>
