<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Permanecer</title>
    
    <link rel="manifest" href="manifest.json?v=202">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#b5fffc">

    <link rel="icon" type="image/jpeg" href="icono.jpg">
    <link rel="apple-touch-icon" href="icono.jpg">
    
    <style>
        body { 
            margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(-45deg, #ffdee9, #b5fffc, #fbc2eb, #a6c1ee); 
            background-size: 400% 400%; animation: gradient 15s ease infinite; 
            overflow: hidden; touch-action: manipulation;
        }
        @keyframes gradient { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }
        .container { text-align: center; width: 100%; max-width: 300px; z-index: 10; }
        h2 { font-weight: 200; color: #444; letter-spacing: 2px; margin-bottom: 20px; }
        .picker-container { display: flex; justify-content: center; height: 180px; margin: 20px 0; position: relative; overflow: hidden; }
        .selection-box { position: absolute; top: 60px; height: 60px; width: 100%; border-top: 1px solid rgba(0,0,0,0.1); border-bottom: 1px solid rgba(0,0,0,0.1); pointer-events: none; }
        .picker-col { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; -ms-overflow-style: none; }
        .picker-col::-webkit-scrollbar { display: none; }
        .item { height: 60px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: rgba(0,0,0,0.25); scroll-snap-align: center; }
        .item.selected { color: #222; font-weight: 400; font-size: 2.2rem; }
        #display { font-size: 4.5rem; display: none; margin: 40px 0; font-weight: 100; color: #222; }
        button { width: 70%; padding: 18px; border-radius: 50px; border: none; background: rgba(255, 255, 255, 0.5); color: #333; font-size: 0.9rem; font-weight: 500; cursor: pointer; backdrop-filter: blur(10px); }
    </style>
</head>
<body>

<div class="container">
    <h2>PERMANECER</h2>
    <div id="display">00:00:00</div>
    <div id="picker" class="picker-container">
        <div class="selection-box"></div>
        <div id="h" class="picker-col"></div>
        <div id="m" class="picker-col"></div>
        <div id="s" class="picker-col"></div>
    </div>
    <button id="btn" onclick="handleButtonClick()">INICIAR</button>
</div>

<audio id="snd" src="tibetan-bowl.mp3" preload="auto"></audio>

<script>
    // Variables de control
    let timerId, endTime, wakeLock = null;
    let isInitialGong = true;
    let count = 0;
    const sound = document.getElementById('snd');

    // Inicialización de selectores
    function fill(id, max) {
        const el = document.getElementById(id);
        let content = '<div class="item"></div>';
        for(let i=0; i<=max; i++) content += `<div class="item">${i.toString().padStart(2,'0')}</div>`;
        el.innerHTML = content + '<div class="item"></div>';
        el.onscroll = () => {
            const items = el.getElementsByClassName('item');
            const center = el.scrollTop + 90;
            for(let item of items) {
                if(Math.abs(center - (item.offsetTop + 30)) < 30) item.classList.add('selected');
                else item.classList.remove('selected');
            }
        };
        setTimeout(() => el.scrollTo(0,0), 300);
    }

    window.onload = () => { fill('h', 23); fill('m', 59); fill('s', 59); };

    // Gestión del Wake Lock para mantener pantalla encendida
    async function requestWakeLock() {
        try {
            wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {
            console.log(`${err.name}, ${err.message}`);
        }
    }

    function releaseWakeLock() {
        if (wakeLock !== null) {
            wakeLock.release().then(() => wakeLock = null);
        }
    }

    sound.onended = () => { 
        if (isInitialGong) {
            isInitialGong = false;
            startCountdown();
        } else {
            count++; 
            if(count < 3) { sound.currentTime = 0; sound.play(); } 
            else { reset(); }
        }
    };

    function updateDisplay() {
        const now = Date.now();
        const remaining = Math.max(0, endTime - now);
        let totalSeconds = Math.floor(remaining / 1000);
        
        let hh = Math.floor(totalSeconds/3600), mm = Math.floor((totalSeconds%3600)/60), ss = totalSeconds%60;
        document.getElementById('display').innerText = `${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;
        
        if (remaining <= 0) {
            clearInterval(timerId);
            sound.play();
        }
    }

    function handleButtonClick() {
        const btn = document.getElementById('btn');
        if(btn.innerText === "DETENER") { reset(); return; }
        
        const h = Math.round(document.getElementById('h').scrollTop / 60);
        const m = Math.round(document.getElementById('m').scrollTop / 60);
        const s = Math.round(document.getElementById('s').scrollTop / 60);
        const totalDuration = (h * 3600 + m * 60 + s) * 1000;

        if(totalDuration <= 0) return;

        requestWakeLock(); // Activamos el bloqueo de pantalla
        isInitialGong = true;
        count = 0;
        
        document.getElementById('picker').style.display = 'none';
        document.getElementById('display').style.display = 'block';
        btn.innerText = "DETENER";
        
        sound.play(); // Suena el gong inicial
        // La cuenta atrás se activará en sound.onended
    }

    function startCountdown() {
        endTime = Date.now() + ((document.getElementById('h').scrollTop/60 * 3600 + document.getElementById('m').scrollTop/60 * 60 + document.getElementById('s').scrollTop/60) * 1000);
        updateDisplay();
        timerId = setInterval(updateDisplay, 1000);
    }

    function reset() {
        clearInterval(timerId);
        sound.pause();
        sound.currentTime = 0;
        releaseWakeLock(); // Soltamos el bloqueo
        document.getElementById('btn').innerText = "INICIAR";
        document.getElementById('picker').style.display = 'flex';
        document.getElementById('display').style.display = 'none';
        isInitialGong = true;
    }
</script>
</body>
</html>
