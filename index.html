<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permanecer</title>
    
    <link rel="icon" type="image/jpeg" href="icono.jpg">
    <link rel="apple-touch-icon" href="icono.jpg">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            background: linear-gradient(-45deg, #ffdee9, #b5fffc, #fbc2eb, #a6c1ee);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.7);
            padding: 2rem;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            text-align: center;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        h2 { font-weight: 300; color: #555; margin-bottom: 20px; }

        /* Ruedas de tiempo */
        .picker-container {
            display: flex;
            justify-content: center;
            height: 180px;
            margin-bottom: 30px;
            position: relative;
            background: rgba(255,255,255,0.4);
            border-radius: 20px;
            overflow: hidden;
        }

        .selection-box {
            position: absolute;
            top: 60px;
            height: 60px;
            width: 90%;
            border-top: 1px solid rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            pointer-events: none;
        }

        .picker-col {
            flex: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .picker-col::-webkit-scrollbar { display: none; }

        .item {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #333;
            scroll-snap-align: center;
        }

        .label { font-size: 0.6rem; color: #999; text-transform: uppercase; }

        #display { font-size: 3.5rem; color: #444; display: none; margin: 40px 0; }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: none;
            background: #555;
            color: white;
            font-size: 1rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Permanecer</h2>
    
    <div id="display">00:00:00</div>

    <div id="picker" class="picker-container">
        <div class="selection-box"></div>
        <div class="picker-col" id="h"></div>
        <div class="picker-col" id="m"></div>
        <div class="picker-col" id="s"></div>
    </div>

    <button id="btn" onclick="start()">INICIAR</button>
</div>

<audio id="snd" src="tibetan-bowl.mp3"></audio>

<script>
    function fill(id, max, label) {
        const el = document.getElementById(id);
        el.innerHTML = '<div class="item"></div>';
        for(let i=0; i<=max; i++) {
            el.innerHTML += `<div class="item">${i.toString().padStart(2,'0')}</div>`;
        }
        el.innerHTML += '<div class="item"><span class="label">${label}</span></div>';
    }
    fill('h', 23, 'hs'); fill('m', 59, 'min'); fill('s', 59, 'seg');

    let timer;
    let secondsLeft;

    function start() {
        const btn = document.getElementById('btn');
        if (btn.innerText === "DETENER") {
            clearInterval(timer);
            resetUI();
            return;
        }

        const h = Math.round(document.getElementById('h').scrollTop / 60);
        const m = Math.round(document.getElementById('m').scrollTop / 60);
        const s = Math.round(document.getElementById('s').scrollTop / 60);
        secondsLeft = (h * 3600) + (m * 60) + s;

        if (secondsLeft <= 0) return;

        document.getElementById('picker').style.display = 'none';
        document.getElementById('display').style.display = 'block';
        btn.innerText = "DETENER";

        timer = setInterval(() => {
            secondsLeft--;
            const hh = Math.floor(secondsLeft / 3600);
            const mm = Math.floor((secondsLeft % 3600) / 60);
            const ss = secondsLeft % 60;
            document.getElementById('display').innerText = 
                `${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;
            
            if (secondsLeft <= 0) {
                clearInterval(timer);
                document.getElementById('snd').play();
                resetUI();
            }
        }, 1000);
    }

    function resetUI() {
        document.getElementById('btn').innerText = "INICIAR";
        document.getElementById('picker').style.display = 'flex';
        document.getElementById('display').style.display = 'none';
    }
</script>

</body>
</html>
