<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permanecer - Temporizador</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #ffdee9, #b5fffc, #fbc2eb, #a6c1ee);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.4);
            padding: 2rem;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 400px;
        }

        /* Estilo de la "Rueda" de selección */
        .picker-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 150px;
            margin: 20px 0;
            overflow: hidden;
            position: relative;
        }

        .picker-column {
            flex: 1;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; /* Firefox */
        }

        .picker-column::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .picker-item {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #777;
            scroll-snap-align: center;
        }

        .selection-overlay {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            height: 50px;
            border-top: 1px solid rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            pointer-events: none;
        }

        #display {
            font-size: 4rem;
            font-weight: 300;
            color: #444;
            margin: 2rem 0;
            display: none;
        }

        button {
            padding: 18px 50px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            background-color: #444;
            color: white;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .label { font-size: 0.8rem; color: #888; margin-bottom: 5px; }
    </style>
</head>
