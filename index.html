<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador Zen</title>
    <style>
        /* Diseño de fondo degradado animado */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #ffdee9, #b5fffc, #fbc2eb, #a6c1ee);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: #555;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.4);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .inputs { margin: 20px 0; }
        
        input {
            width: 60px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            text-align: center;
            font-size: 1.2rem;
            margin: 0 5px;
        }

        button {
            padding: 15px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            background-color: #555;
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active { transform: scale(0.95); }

        #display {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Temporizador Zen</h1>
        
        <div id="display">00:00:00</div>

        <div id="setup" class="inputs">
            <input type="number" id="h" placeholder="HH" min="0" value="0">
            <input type="number" id="m" placeholder="MM" min="0" max="59" value="0">
            <input type="number" id="s" placeholder="SS" min="0" max="59" value="0">
        </div>

        <button id="btnAction" onclick="toggleTimer()">INICIAR</button>
    </div>

    <audio id="bowlSound" src="tibetan-bowl.mp3"></audio>

    <script>
        let interval;
        let timeLeft;
        let isRunning = false;

        function toggleTimer() {
            const btn = document.getElementById('btnAction');
            const display = document.getElementById('display');
            const setup = document.getElementById('setup');
            const sound = document.getElementById('bowlSound');

            if (!isRunning) {
                // Calcular tiempo total
                const h = parseInt(document.getElementById('h').value) || 0;
                const m = parseInt(document.getElementById('m').value) || 0;
                const s = parseInt(document.getElementById('s').value) || 0;
                timeLeft = (h * 3600) + (m * 60) + s;

                if (timeLeft <= 0) return alert("Pon un tiempo válido");

                // Interfaz
                isRunning = true;
                btn.innerText = "DETENER";
                setup.style.display = "none";
                display.style.display = "block";

                interval = setInterval(() => {
                    timeLeft--;
                    updateDisplay();

                    if (timeLeft <= 0) {
                        clearInterval(interval);
                        sound.play(); // Reproducir sonido
                        resetUI();
                    }
                }, 1000);
            } else {
                clearInterval(interval);
                resetUI();
            }
        }

        function updateDisplay() {
            const h = Math.floor(timeLeft / 3600);
            const m = Math.floor((timeLeft % 3600) / 60);
            const s = timeLeft % 60;
            document.getElementById('display').innerText = 
                `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function resetUI() {
            isRunning = false;
            document.getElementById('btnAction').innerText = "INICIAR";
            document.getElementById('setup').style.display = "block";
            document.getElementById('display').style.display = "none";
        }
    </script>
</body>
</html>
